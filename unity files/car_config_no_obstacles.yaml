behaviors:
  # This key MUST match the "Behavior Name" field in your Behavior Parameters
  # component. Your log shows "Connected new brain: DifferentialCarAgent", so
  # this is correct. If you rename it in Unity, rename it here too.
  DifferentialCarAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      # Entropy coefficient. Raised from the 0.005 default to keep exploration
      # alive longer so the policy actually samples in-place turns before it
      # commits to forward-only. Watch entropy in TensorBoard: if it still
      # nose-dives in the first ~100k steps, push this toward 0.02.
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    network_settings:
      # Turn on observation/return normalization. Your obs are mostly
      # pre-normalized, but this also stabilizes the value function's scale.
      # Optional; set back to false if you want to match your old runs exactly.
      normalize: true
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    # Smaller than max_steps so you get intermediate checkpoints to fall back on.
    checkpoint_interval: 200000
    # 500k was too short for a from-scratch retrain that also has to climb a
    # 3-lesson curriculum. Give it room; stop early if TensorBoard plateaus.
    max_steps: 3000000
    time_horizon: 64
    # Tighter than the 50k default so you can actually SEE entropy and reward
    # move early, which is exactly the window where this problem is decided.
    summary_freq: 20000

# This is what was missing. It drives the "heading_range_deg" parameter your
# OnEpisodeBegin reads. Start with the target basically ahead, widen as reward
# climbs. Thresholds are guesses tied to your reward scale — check the mean
# reward at which lesson 1 is "solved" in TensorBoard and adjust.
environment_parameters:
  heading_range_deg:
    curriculum:
      - name: FacingTarget      # +/-30 deg off the target -> easy, turning is a nudge
        completion_criteria:
          measure: reward
          behavior: DifferentialCarAgent
          threshold: 0.6
          min_lesson_length: 100
          require_reset: true
        value: 60.0
      - name: WideTurns         # +/-90 deg -> real turns required
        completion_criteria:
          measure: reward
          behavior: DifferentialCarAgent
          threshold: 0.6
          min_lesson_length: 100
          require_reset: true
        value: 180.0
      - name: FullRandom        # +/-180 deg -> anywhere, including dead behind
        value: 360.0
