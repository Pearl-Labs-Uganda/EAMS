behaviors:
  DifferentialCarAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 250000
    # Bumped to 5M: 43 obstacles across a 6-stage ramp needs more room than 3M.
    # Progress thresholds below are fractions, so they rescale automatically.
    # Stop early if TensorBoard plateaus.
    max_steps: 5000000
    time_horizon: 64
    summary_freq: 20000

environment_parameters:
  heading_range_deg: 360.0

  # 43 total obstacles, ramped in 6 stages so each density bump is digestible.
  # Progress-based pacing (fractions of max_steps = 5,000,000):
  #   Clear     0  -> until  5%  (0.25M)  warm-up / sanity, already solved
  #   Light     6  -> until 20%  (1.0M)   first taste of avoidance
  #   Sparse   15  -> until 38%  (1.9M)
  #   Moderate 25  -> until 56%  (2.8M)   this + Sparse are where avoidance is learned
  #   Dense    35  -> until 75%  (3.75M)
  #   Full     43  -> remaining 25% (1.25M)
  obstacle_count:
    curriculum:
      - name: Clear
        completion_criteria:
          measure: progress
          behavior: DifferentialCarAgent
          threshold: 0.05
          min_lesson_length: 100
          require_reset: true
        value: 0.0
      - name: Light
        completion_criteria:
          measure: progress
          behavior: DifferentialCarAgent
          threshold: 0.20
          min_lesson_length: 100
          require_reset: true
        value: 6.0
      - name: Sparse
        completion_criteria:
          measure: progress
          behavior: DifferentialCarAgent
          threshold: 0.38
          min_lesson_length: 100
          require_reset: true
        value: 15.0
      - name: Moderate
        completion_criteria:
          measure: progress
          behavior: DifferentialCarAgent
          threshold: 0.56
          min_lesson_length: 100
          require_reset: true
        value: 25.0
      - name: Dense
        completion_criteria:
          measure: progress
          behavior: DifferentialCarAgent
          threshold: 0.75
          min_lesson_length: 100
          require_reset: true
        value: 35.0
      - name: Full
        value: 43.0
