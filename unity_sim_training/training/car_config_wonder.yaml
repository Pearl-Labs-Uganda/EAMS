behaviors:
  # MUST match the "Behavior Name" field in Behavior Parameters. Deliberately
  # NOT "DifferentialCarAgent" - a different name keeps wonder-mode runs,
  # checkpoints and .onnx exports from colliding with the target-seeking ones.
  WonderCar:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      # Raised from 0.01. The target-seeking agent had a dense distance reward
      # pulling it in a specific direction; wonder mode has no goal gradient, so
      # exploration has to carry more of the load. If entropy still collapses
      # early in TensorBoard, try 0.03.
      beta: 0.02
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 200000
    # DO NOT --initialize-from the target-seeking runs. Those weights expect an
    # 11-observation input this network does not have (18 vs 11), so the load
    # will fail or, worse, silently mismatch. Wonder mode trains from scratch.
    max_steps: 3000000
    time_horizon: 64
    summary_freq: 20000

environment_parameters:
  # No heading_range_deg here. In the target-seeking agent heading was defined
  # relative to the target, so a narrow range meant "target basically ahead" =
  # easy. With no target there is no easy or hard heading, so the agent always
  # spawns fully random and the lesson would be meaningless.

  # Obstacle density curriculum, same mechanism as the target-seeking config.
  #
  # THRESHOLDS ARE PLACEHOLDERS - the reward scale is completely different here.
  # Reward is now dominated by accumulated forward speed, so a clean run scores
  # roughly  forwardSpeedReward * avgNormalisedSpeed * maxEpisodeSteps
  #        = 0.005 * ~0.5 * 1500  ~= 3.75,
  # against ~ -1 for an early collision. That is a different universe from the
  # 0.4-0.6 thresholds in car_config_obsatcles.yaml. Run the Clear lesson once,
  # read where mean reward plateaus in TensorBoard, and set these from that.
  # As before, thresholds should step DOWN as obstacles increase, because more
  # clutter means more collisions and more time spent turning rather than
  # driving forward.
  obstacle_count:
    curriculum:
      - name: Clear            # empty room -> learn to drive forward at all
        completion_criteria:
          measure: reward
          behavior: WonderCar
          threshold: 3.0       # PLACEHOLDER - see note above
          min_lesson_length: 100
          require_reset: true
        value: 0.0
      - name: Sparse           # first real avoidance
        completion_criteria:
          measure: reward
          behavior: WonderCar
          threshold: 2.5       # PLACEHOLDER
          min_lesson_length: 150
          require_reset: true
        value: 3.0
      - name: Moderate         # weaving between clusters
        completion_criteria:
          measure: reward
          behavior: WonderCar
          threshold: 2.0       # PLACEHOLDER
          min_lesson_length: 150
          require_reset: true
        value: 6.0
      - name: Full             # set to your furnitureList.Count
        value: 12.0
